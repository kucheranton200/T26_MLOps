[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-team2-project"
version = "0.1.0"
description = "Учебный ML-проект команды 2 (курс MLOps)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.0.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
